name: PR description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the template was filled in
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | tools/check-pr-body.sh
