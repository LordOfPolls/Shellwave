name: Release (FOSS)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GIT_CLIFF_VERSION: '2.13.1'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the version the build declares
        id: declared
        run: tools/version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Check the tag against the declared version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          DECLARED: ${{ steps.declared.outputs.name }}
        run: |
          if [ "$TAG" != "$DECLARED" ]; then
            echo "Tag $TAG does not match versionName $DECLARED in app/build.gradle.kts." >&2
            echo "Delete the tag, run tools/prepare-release.sh $TAG, commit, and tag again." >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELLWAVE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SHELLWAVE_RELEASE_KEYSTORE_BASE64 is not set - the build will be unsigned." >&2
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Outside the checkout, so it cannot be picked up by anything that globs the workspace.
          keystore="$RUNNER_TEMP/shellwave-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Build assembleFossRelease
        env:
          SHELLWAVE_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SHELLWAVE_RELEASE_STORE_PASSWORD: ${{ secrets.SHELLWAVE_RELEASE_STORE_PASSWORD }}
          SHELLWAVE_RELEASE_KEY_ALIAS: ${{ secrets.SHELLWAVE_RELEASE_KEY_ALIAS }}
          SHELLWAVE_RELEASE_KEY_PASSWORD: ${{ secrets.SHELLWAVE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleFossRelease

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shellwave-release.jks"

      - name: Locate the APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk/foss/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "No APK under app/build/outputs/apk/foss/release" >&2
            exit 1
          fi
          case "$apk" in
            *unsigned*)
              # An unsigned APK cannot be installed, so it must not reach a release page.
              echo "Built $apk - unsigned. Set the SHELLWAVE_RELEASE_* secrets." >&2
              exit 1
              ;;
          esac
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellwave-foss-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Write the release notes
        if: github.event_name == 'push'
        run: |
          url="https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION"
          url="$url/git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP" --strip-components=1 \
            "git-cliff-$GIT_CLIFF_VERSION/git-cliff"

          # --current is the tag at HEAD, which on a tag push is the tag being released.
          "$RUNNER_TEMP/git-cliff" --config cliff.toml --current --strip all > "$RUNNER_TEMP/notes.md"

          # The template opens each release with `## <version> - <date>`, which CHANGELOG.md needs
          # and a release page does not: GitHub already prints the tag as the title above the body.
          awk 'NR == 1 && /^## / { next } { print }' "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/body.md"

          echo "--- release notes ---"
          cat "$RUNNER_TEMP/body.md"

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # Named after the tag: a release page full of app-foss-release.apk tells a user
          # nothing about which version they just downloaded.
          asset="$RUNNER_TEMP/shellwave-$TAG-foss.apk"
          cp "$APK" "$asset"

          # A re-run after a transient failure should finish the release rather than fail on the
          # one it already created.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/body.md" \
              --verify-tag
          fi
