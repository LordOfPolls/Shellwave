[changelog]
header = """
# Changelog

"""

body = """
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {{ commit.message | upper_first }}{% if commit.breaking %} (**breaking change**){% endif %}
{% endfor %}{% endfor %}{% if version and previous.version %}
[Every commit in this release](https://github.com/LordOfPolls/Shellwave/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""

footer = ""
trim = false

[git]
conventional_commits = true

filter_unconventional = false
filter_commits = false

split_commits = false
protect_breaking_commits = true

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->New" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^revert", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Internal" },
    { message = "^build", group = "<!-- 3 -->Internal" },
    { message = "^ci", group = "<!-- 3 -->Internal" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
    { message = ".*", group = "<!-- 5 -->Other changes" },
]

tag_pattern = "^[0-9]+\\.[0-9]+"

sort_commits = "oldest"
topo_order = false
